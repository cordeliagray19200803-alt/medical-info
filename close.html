<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#ffffff">
<title>ご協力ありがとうございました</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff;color:#20242a;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
main{width:100%;max-width:560px;text-align:center;border:2px solid #d71920;border-radius:18px;
padding:30px 22px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
h1{margin:0;color:#b00020;font-size:1.55rem;line-height:1.45}
</style>
</head>
<body>
<main><h1>ご協力ありがとうございました。</h1></main>

<audio id="closeSound" preload="auto" src="close.wav"></audio>

<script>
window.addEventListener("load", async function(){
  try{
    await document.getElementById("closeSound").play();
  }catch(e){}
  if("speechSynthesis" in window){
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance("ご協力ありがとうございました。");
      u.lang="ja-JP";
      u.rate=0.95;
      u.pitch=1.0;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  setTimeout(function(){
    window.location.replace("https://example.com/");
  },1500);
});
</script>
</body>
</html>
