<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#ffffff">
  <title>ご協力ありがとうございました</title>

  <style>
    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
    }

    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:#fff;
      color:#20242a;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",
                  "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    }

    main{
      width:100%;
      max-width:560px;
      text-align:center;
      border:2px solid #d71920;
      border-radius:18px;
      padding:30px 22px;
      box-shadow:0 6px 20px rgba(0,0,0,.08);
    }

    h1{
      margin:0 0 24px;
      color:#b00020;
      font-size:1.55rem;
      line-height:1.45;
    }

    p{
      margin:16px 0;
      font-size:1.08rem;
      line-height:1.8;
      font-weight:700;
    }

    .note{
      margin-top:24px;
      padding-top:20px;
      border-top:1px solid #d9dde1;
      color:#505860;
      font-size:.98rem;
      font-weight:600;
    }
  </style>
</head>

<body>
  <main>
    <h1>ご協力ありがとうございました。</h1>

    <p>
      個人情報保護のため、<br>
      このタブを「×」で閉じてください。
    </p>

    <p class="note">
      このまま検索などを続けることもできます。
    </p>
  </main>

  <script>
    function keepClosePageInHistory() {
      try {
        history.pushState({ closePage: true }, "", location.href);
      } catch (error) {
        // 履歴操作に対応していない場合も表示は継続
      }
    }

    window.addEventListener("load", function () {
      // close.html のURLは変更しない
      keepClosePageInHistory();

      window.addEventListener("popstate", function () {
        keepClosePageInHistory();
      });

      // 読み上げ対応端末のみ実行
      if (!("speechSynthesis" in window)) return;

      try {
        speechSynthesis.cancel();

        const message =
          new SpeechSynthesisUtterance("ご協力ありがとうございました。");

        message.lang = "ja-JP";
        message.rate = 0.95;
        message.pitch = 1.0;
        message.volume = 1.0;

        speechSynthesis.speak(message);
      } catch (error) {
        // 読み上げできなくても画面表示は継続
      }
    });
  </script>
</body>
</html>
